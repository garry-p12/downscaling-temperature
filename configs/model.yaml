# Model architecture config. Swin-style encoder + temperature head.
# Starting hyperparameters are SwinIR-scale; adjust after profiling.
# TEMPERATURE ONLY: coarse = NASA POWER T2M (0.5 deg), target = 10 km.

# Which architecture build_model() constructs. Override per run with
# `python -m training.train --arch unet`. Checkpoints go to
# checkpoints/<arch>/ so comparison runs never clobber each other.
#   swin      - hierarchical windowed attention (this project's model)
#   swinir    - flat windowed attention, no hierarchy
#   restormer - channel / transposed attention (cost independent of H*W)
#   segformer - global attention w/ spatial-reduction keys, all-MLP decoder
#   maxvit    - block (local) + grid (sparse global) attention
#   vit       - plain isotropic ViT, full global attention, no locality prior
#   convnext  - modern conv U-Net: isolates "attention" from "modern design"
#   unet      - plain conv U-Net, attention ablation
#   deepsd    - stacked SRCNN + elevation (Vandal et al. 2017), tiny reference
arch: swin

in_channels: 8          # coarse_tmp, dem, landcover, coastal_dist, urban_frac, land_mask, doy_sin, doy_cos

unet:
  # base=144 -> 38.97M params, near-parity with the Swin's 41.44M. Matching the
  # budget is the point: a narrower U-Net losing would confound "attention
  # helps" with "more parameters help".
  base: 144
  depth: 4

deepsd:
  n_stages: 3           # deliberately tiny (~0.1M) — that gap is the finding
  n1: 64
  n2: 32

# Transformer zoo. Sizes are NOT parameter-matched across families: the domain
# is 49x40 with ~1100 training days, so every model here is already heavily
# over-parameterized and forcing parity would only handicap the efficient
# designs. Parameter counts are reported alongside RMSE instead.
swinir:
  dim: 96
  depths: [6, 6, 6, 6]
  num_heads: 6
  window_size: 8

# SwinIR-light: fewer/shallower groups and a narrower dim. The full SwinIR is
# ~9.6 h for 30 epochs on this domain; the light variant is the version the SR
# literature actually recommends when data is limited.
swinir_light:
  dim: 60
  depths: [4, 4, 4, 4]
  num_heads: 6
  window_size: 8

edsr:
  dim: 128
  n_blocks: 16

esrt:
  dim: 64
  depth: 6
  num_heads: 4
  reduction: 4        # attend on a 1/4-scale token grid

restormer:
  dim: 48
  depths: [4, 6, 6, 8]
  heads: [1, 2, 4, 8]

segformer:
  dims: [32, 64, 160, 256]
  depths: [2, 2, 2, 2]
  heads: [1, 2, 5, 8]
  srs: [4, 2, 1, 1]     # key/value spatial reduction per stage
  decoder_dim: 256

maxvit:
  dim: 96
  depth: 6
  num_heads: 4
  p: 7                  # attention tile size (block) / stride (grid)

vit:
  dim: 384              # isotropic: no hierarchy, full global attention
  depth: 8
  num_heads: 6
  patch_size: 4         # 49x40 -> ~13x10 tokens; quadratic attention is cheap

convnext:
  base: 96
  depths: [2, 2, 4, 2]
patch_size: 2           # conv patch embed stride

encoder:
  embed_dim: 96
  depths: [2, 2, 6, 2]
  num_heads: [3, 6, 12, 24]
  window_size: 8
  mlp_ratio: 4.0
  drop_path: 0.1

temp_head:
  enabled: true
  out_channels: 1
  # loss: pixel (L1) + SSIM — see training/losses.py
