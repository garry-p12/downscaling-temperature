[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "downscaling-temperature"
version = "0.1.0"
description = "Statistical downscaling of daily 2 m air temperature, 50 km -> 10 km"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "torch>=2.1",
    "einops>=0.7",
    "xarray>=2023.6",
    "zarr>=3.0",
    "netcdf4>=1.6",
    "dask>=2023.6",
    "rioxarray>=0.15",
    "rasterio>=1.3",
    "pyproj>=3.6",
    "geopandas>=0.14",
    "shapely>=2.0",
    "fsspec>=2023.6",
    "s3fs>=2023.6",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# Only needed to BUILD a dataset from scratch (DEM tiles from USGS 3DEP).
covariates = ["py3dep>=0.16"]
# Only needed when logging.wandb.enabled = true.
tracking = ["wandb>=0.16"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools]
packages = ["common", "data", "models", "training", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The suite must stay runnable without a dataset, a GPU or network access, so
# anything needing those is marked and deselected by default in CI.
markers = ["slow: exercises a full model forward pass"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # long lines are almost all explanatory comments
    "E702",    # `ax.set_xticks([]); ax.set_yticks([])` — house style in the plotting code
    "B028",    # warnings.warn stacklevel: these warnings are for the operator, not a caller
    "B905",    # zip(strict=) — kept off for 3.9-era readability
    "SIM108",  # ternary-instead-of-if hurts readability in the numeric code
]

[tool.ruff.lint.per-file-ignores]
# Package re-exports.
"**/__init__.py" = ["F401"]
# `cfg.missing` inside pytest.raises is the assertion, not a useless expression.
"tests/*" = ["B018"]
